<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact - Joseph Ngoma</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="contact">
    <header>
        <h1>Joseph Habimana Ngoma</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Me</a>
            <a href="books.html">Books</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Contact Me</h2>
        <p>If you have any questions, feedback, or would like to connect, please fill out the form below.</p>

        <!-- ✅ CONTACT FORM -->
        <form action="https://formspree.io/f/yourcode" method="POST" id="contact-form">
            <div style="margin-bottom: 15px;">
                <input type="text" name="name" placeholder="Your Name" required style="padding: 10px; width: 80%; max-width: 500px;">
            </div>
            <div style="margin-bottom: 15px;">
                <input type="email" name="email" placeholder="Your Email" required style="padding: 10px; width: 80%; max-width: 500px;">
            </div>
            <div style="margin-bottom: 15px;">
                <textarea name="message" placeholder="Your Message" rows="5" required style="padding: 10px; width: 80%; max-width: 500px;"></textarea>
            </div>
            <button type="submit" class="button">Send Message</button>
        </form>

        <!-- ✅ SUCCESS MESSAGE -->
        <p id="thank-you" style="display:none; margin-top: 20px; color: #90ee90; font-weight: bold;">
            ✅ Thank you! Your message was sent successfully.
        </p>
    </main>

    <footer>
        <!-- Thank You Message (hidden by default) -->
<p id="thank-you" style="display:none; margin-top: 20px; color: #90ee90; font-weight: bold;">
    ✅ Thank you! Your message was sent successfully.
  </p>
    </footer>

    <!-- ✅ SCRIPT TO SHOW MESSAGE AFTER SEND -->
    <script>
        const form = document.querySelector("form");
        const thankYou = document.getElementById("thank-you");
      
        form.addEventListener("submit", function (e) {
          e.preventDefault(); // stop regular submit
          const data = new FormData(form);
          fetch(form.action, {
            method: form.method,
            body: data,
            headers: {
              'Accept': 'application/json'
            }
          }).then(response => {
            if (response.ok) {
              form.reset(); // clear form
              thankYou.style.display = "block"; // show message
            } else {
              alert("There was a problem. Please try again.");
            }
          });
        });
      </script>      
</body>
</html>
