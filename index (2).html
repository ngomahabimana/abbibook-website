
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Joseph Habimana Ngoma - Abbibook</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: url('images/sky.jpg') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            font-family: Arial, sans-serif;
            color: #eee;
            text-align: center;
        }

        header {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 20px;
        }

        nav a {
            color: #ffcc00;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            color: #ff9900;
        }

        main {
            background-color: rgba(0, 0, 0, 0.65);
            padding: 60px 20px;
            margin: 50px auto;
            border-radius: 12px;
            width: 90%;
            max-width: 700px;
        }

        .button {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 28px;
            background-color: #ffcc00;
            color: #000;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            transition: 0.3s ease;
        }

        .button:hover {
            background-color: #ff9900;
            color: white;
            transform: scale(1.05);
        }

        .verse {
            font-style: italic;
            margin-top: 30px;
            color: #f1f1f1;
        }

        footer {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 15px;
            color: #aaa;
            margin-top: 40px;
        }

        img.profile-pic {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Joseph Habimana Ngoma</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Me</a>
            <a href="books.html">Books</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <img src="images/joseph_profile.jpg" alt="Joseph Profile" class="profile-pic">
        <h2>Welcome to Abbibook</h2>
        <p>Christian Author • Refugee Survivor • Voice for the Kingdom of God</p>
        <a class="button" href="https://www.amazon.com/stores/JOSEPH-HABIMANA-NGOMA/author/B0DGS28QLB" target="_blank">View My Books on Amazon</a>
        <p class="verse">“You will know the truth, and the truth will set you free.” — John 8:32</p>
    </main>

    <footer>
        <p>© 2025 Joseph Habimana Ngoma. All rights reserved.</p>
    </footer>

</html>
